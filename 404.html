<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Page not found | Puravigal</title>
  <meta name="description" content="The page you requested could not be found. Return to Puravigal home to continue browsing.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://puravigal.com/404">
  <link rel="icon" href="/images/fav/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/common.css">
</head>
<body>
  <main id="main" class="container section not-found-shell">
    <img src="/images/puravigal-logo.svg" alt="Puravigal" width="170" height="42" decoding="async">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p class="lead">The page may have moved, the URL may be incorrect, or the content might no longer exist.</p>
    <a class="btn" href="/index.html">Go to Home Page</a>
    <p class="small">You will be redirected to the home page automatically in <span id="redirect-seconds">8</span> seconds.</p>
  </main>

  <script>
    (function () {
      var seconds = 8;
      var node = document.getElementById('redirect-seconds');
      var timer = setInterval(function () {
        seconds -= 1;
        if (node) node.textContent = String(seconds);
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = '/index.html';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
